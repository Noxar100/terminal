html,body{height:100%;overflow:hidden;background:#050505;font-family:'Courier New',monospace}
body{display:flex;flex-direction:column}

#titlebar{

.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}

#ht{
  flex:1;

  overflow-x:hidden;

}
#ht::-webkit-scrollbar{width:3px}
#ht::-webkit-scrollbar-thumb{background:#1a3a1a}

.ln{display:block;word-wrap:break-word}
.dim{color:#2a5a2a}.warn{color:#ffaa00}.err{color:#ff4444}
.info{color:#00aaff}.ok{color:#00ff41}.hi{color:#ffffff}
.cya{color:#00ffff}.mag{color:#ff44ff}

#inp-row{
  display:flex;align-items:center;gap:6px;
  padding:8px 10px;
  background:#0a0a0a;
  border-top:1px solid #1a3a1a;
  flex-shrink:0;
}
#ps1{color:#00ff41;font-size:11px;white-space:nowrap;flex-shrink:0}
#inp{
  flex:1;background:transparent;border:none;outline:none;

  font-size:16px; /* 16px = no zoom on iOS */
  caret-color:#00ff41;
  min-width:0;
}

/* quick command buttons */
#quickbar{
  display:flex;gap:5px;padding:6px 8px;

  overflow-x:auto;flex-shrink:0;

  scrollbar-width:none;
}
#quickbar::-webkit-scrollbar{display:none}
.qbtn{

}
.qbtn:active{background:#1a3a1a;color:#00ff41}

#statusbar{

.sb{font-size:9px;color:#2a5a2a;padding:3px 8px;white-space:nowrap;border-right:1px solid #1a3a1a}

body{isolation:isolate;position:relative}

    String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+
    String(s%60).padStart(2,'0');
},1000);

const mac=()=>[...Array(6)].map(()=>hex(2)).join(':');
const hash=()=>hex(64);

let virusActive=false, virusTimer=null, virusLines=[], virusTick=0;
const DEMO_IPS=['192.0.2.','198.51.100.','203.0.113.'];
function toggleVirus(){
  const btn=document.getElementById('virusBtn');
  if(virusActive){
    virusActive=false;clearInterval(virusTimer);virusTimer=null;
    btn.textContent='☣ VIRUS: OFF';btn.classList.remove('is-on');
    w('<span class="warn"> VIRUS switched OFF — no network activity occurred.</span>');
    startInput();return;
  }
  virusActive=true;virusTick=0;virusLines=[];
  btn.textContent='VIRUS ON';btn.classList.add('is-on');
  w('');w('<span class="virus-panel-label">╔══ VIRUS / IP FLOOD VISUALIZER — LOCAL ONLY ══╗</span>');
  w('<span class="warn">SIMULATION MODE: generated documentation-range IPs; no packets are sent.</span>');
  w('<span class="dim">TIMESTAMP              SOURCE IP        NODE / MOCK DATA                       STATUS</span>');
  for(let i=0;i<72;i++){
    const prefix=DEMO_IPS[i%DEMO_IPS.length];
    const address=prefix+(10+(i*7)%240);
    const row=document.createElement('span');
    row.className='ln virus-line';
    row.textContent=now()+'   '+address.padEnd(16)+' NODE-'+hex(4).toUpperCase()+'   bytes='+(rand(128,65535))+'  hash='+hex(12)+'  [QUEUED]';

    if(!virusActive)return;

    T.scrollTop=T.scrollHeight;

  let i=0;

    if(i>=lines.length){done&&done();return;}

function startInput(){
  inp.disabled = false;
  inp.focus();
}

function runCmd(cmd){
  if(cmd==='clear'){
    COMMANDS.clear();
    inp.value='';
    return;
  }
  if(inp.disabled) return;
  inp.value=cmd;
  inp.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
}

inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const cmd=inp.value.trim().toLowerCase();
    inp.value='';
    if(!cmd){w('');return;}
    hist.unshift(cmd);hIdx=-1;
    w('<span class="dim">'+now()+'</span> <span class="ok">root@shadownet:~#</span> '+cmd);
    if(virusActive && cmd!=='virus' && cmd!=='off'){
      w('<span class="warn">[SIMULATION] Type <b>virus</b> to stop the visual demo before running another command.</span>');
      startInput();
      return;
    }
    inp.disabled = true;
    if(COMMANDS[cmd]) COMMANDS[cmd]();
    else if(cmd==='help') delay(HELP,28,startInput);
    else{w('<span class="err">bash: '+cmd+': command not found</span>');w('');startInput();}
  }
  if(e.key==='ArrowUp'){e.preventDefault();if(hIdx<hist.length-1){hIdx++;inp.value=hist[hIdx];}}
  if(e.key==='ArrowDown'){e.preventDefault();if(hIdx>0){hIdx--;inp.value=hist[hIdx];}else{hIdx=-1;inp.value='';}}
});

// tap outside input → refocus
document.getElementById('ht').addEventListener('click',()=>inp.focus());
